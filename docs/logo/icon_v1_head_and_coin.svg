<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA33A"/><stop offset="1" stop-color="#0B6B26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#F2A81D"/>
    </linearGradient>
  </defs>
  <!-- full-bleed square: iOS and Android apply their own corner masks -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- back ridge -->
  <g fill="#0B4F1D" opacity="0.35">
    <path d="M0,860 Q60,800 120,860 Q180,800 240,860 Q300,800 360,860 Q420,800 480,860 Q540,800 600,860 Q660,800 720,860 Q780,800 840,860 Q900,800 960,860 Q992,830 1024,860 V1024 H0 Z"/>
  </g>
  <g stroke="#0B3D16" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <!-- crest -->
    <path d="M250,360 l40,-110 l40,100 Z M330,320 l46,-120 l40,110 Z M420,300 l44,-110 l36,108 Z" fill="#2A8F2F"/>
    <!-- head -->
    <path d="M210,560 C180,400 300,300 450,318 C540,330 580,360 640,372 L840,392 C900,398 912,452 896,490
             C884,520 852,538 812,540 L600,560 C520,620 330,640 210,560 Z" fill="#3FAE3A"/>
    <path d="M262,600 C360,640 520,620 600,560 L812,540 C840,538 870,526 884,508 L600,520 C500,540 380,560 262,600 Z" fill="#A6E58A" stroke="none"/>
    <path d="M600,548 Q720,560 880,500" fill="none"/>
    <!-- teeth (friendly grin) -->
    <path d="M640,548 l18,34 l18,-36 Z M700,543 l18,34 l18,-37 Z M760,536 l18,33 l18,-38 Z M818,525 l16,30 l16,-36 Z" fill="#FFFFFF" stroke-width="12"/>
    <circle cx="866" cy="420" r="10" fill="#0B3D16" stroke="none"/>
    <!-- eye -->
    <circle cx="470" cy="316" r="96" fill="#3FAE3A"/>
    <ellipse cx="478" cy="322" rx="56" ry="62" fill="#FFD84A" stroke-width="14"/>
    <ellipse cx="488" cy="326" rx="13" ry="44" fill="#151515" stroke="none"/>
    <circle cx="456" cy="296" r="13" fill="#FFFFFF" stroke="none"/>
  </g>
  <!-- coin -->
  <g transform="translate(700 700)">
    <circle r="150" fill="#0B3D16" opacity="0.25" transform="translate(10 14)"/>
    <circle r="150" fill="url(#coin)" stroke="#8A5A00" stroke-width="18"/>
    <circle r="112" fill="none" stroke="#B57A0A" stroke-width="10" opacity="0.6"/>
    <!-- a scale (CrocoCash points) on the coin -->
    <path d="M0,-74 Q66,-56 60,6 Q54,60 0,76 Q-54,60 -60,6 Q-66,-56 0,-74 Z" fill="#3FAE3A" stroke="#0B6B26" stroke-width="12"/>
    <path d="M0,-50 L0,52" stroke="#0B6B26" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-24" cy="-26" r="10" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>

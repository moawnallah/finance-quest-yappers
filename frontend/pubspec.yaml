name: finance_quest
description: Finance Quest draft (Collabothon 2026). Gamified investing education, Flutter web + mobile.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/roadmap.json
    - assets/eu_benchmark.json
    - assets/steps.json

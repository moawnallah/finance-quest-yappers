cards:
  - id: f3.c1
    title: "Interest on interest"
    body: >-
      With compound interest, the interest you earn is added to the balance,
      and next year it earns interest too. The growth starts slowly and then
      speeds up, because each year adds a percentage of a bigger amount. With
      simple interest, you earn the same amount every year.
    example: "2,000 PLN at 6% a year for 10 years: about 3,582 PLN with interest added each year, 3,200 PLN if the interest is paid out."
    links: [sec_saving_investing_tips, stlfed_compound_interest]
    checked: "2,000 x 1.06^10 = 3,581.70; 2,000 + 10 x 120 = 3,200 (Claude, 2026-11-21)."

  - id: f3.c2
    title: "Time matters most"
    body: >-
      Because growth speeds up over time, the years your money stays invested
      count more than the amount you add later. Starting early gives
      compounding more years to work. Waiting ten years can cost more than a
      much lower monthly amount would.
    example: "200 PLN a month at 5% a year (added monthly) until 65: starting at 25 gives about 305,000 PLN from 96,000 paid in; starting at 35 gives about 166,000 PLN from 72,000."
    links: [sec_saving_investing_tips, stlfed_compound_interest]
    checked: "Future value of 200 PLN a month, r = 5%/12: n = 480 -> 305,204; n = 360 -> 166,452 (Claude, 2026-11-21). Illustrative rate, not a forecast."

  - id: f3.c3
    title: "The rule of 72"
    body: >-
      A quick way to see compounding: divide 72 by the yearly rate to get
      roughly how many years it takes for money to double. It works the other
      way too: at a given inflation rate, it tells you how fast prices double,
      so your cash buys half as much.
    example: "At 6% a year, money doubles in about 72 / 6 = 12 years (exactly 11.9). At 3% inflation, prices double in about 24 years."
    links: [sec_saving_investing_tips]
    checked: "ln 2 / ln 1.06 = 11.90 years (Claude, 2026-11-21)."

items:
  - id: f3.e1
    kind: numeric
    q: "You put 1,000 PLN in an account that pays 10% a year, and the interest is added each year. How much is there after 2 years?"
    answer: 1210
    unit: PLN
    tolerance: {kind: absolute, band: 5}
    input: {min: 1000, max: 1500, step: 5}
    why: "Year 1: 1,000 + 100 = 1,100. Year 2: 1,100 + 110 = 1,210. The second year's interest is earned on the first year's interest too."
    check: true
  - id: f3.e2
    kind: single
    q: "Two accounts both pay 5% a year on 1,000 PLN for 10 years. One adds the interest to the balance each year, the other pays it out. Which ends with more in total?"
    options:
      - "The one that adds interest to the balance"
      - "Both end the same"
      - "The one that pays it out"
    answer: 0
    why: "When interest stays in the account, it earns interest itself: about 1,629 PLN vs 1,500 PLN after 10 years."
    check: true
  - id: f3.e3
    kind: true_false
    q: "With compound interest, starting five years earlier can matter more than a slightly higher rate."
    answer: true
    why: "Time multiplies the effect: every extra year adds interest on all the interest earned so far."

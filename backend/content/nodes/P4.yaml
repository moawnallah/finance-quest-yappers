node: P4
panel: PORTFOLIO
title: "Rebalancing and discipline in a crash"
after: [P2]
author: "draft by Claude (AI), 2026-11-20"
reviewer: null
status: draft

cards:
  - id: p4.c1
    title: "Rebalancing"
    body: >-
      You choose a target mix, for example 60% shares and 40% bonds. Markets
      move your mix away from it. Rebalancing means returning to the target
      from time to time: selling some of what grew and buying what fell. It is
      a rule decided in calm times, so you do not have to decide in a panic.
    example: "Target 60/40 on 10,000 PLN. Shares fall and the mix becomes 50/50 at 8,000 PLN; rebalancing moves 800 PLN from bonds to shares to get back to 60/40."
    links: []
    checked: "Our worked example: 60% of 8,000 = 4,800; shares at 4,000 need +800. Definition: reviewer to add a source."

  - id: p4.c2
    title: "Selling after a fall locks in the loss"
    body: >-
      A fall is a loss on paper until you sell. In 2008, US shares (S&P 500
      with dividends) fell 36.6%; in 2009 they rose 25.9%. Someone who sold
      at the end of 2008 kept the loss and missed the rebound. Someone who
      kept a rule, holding or rebalancing, did not.
    example: "10,000 PLN in US shares at the start of 2008: about 6,345 at the end of 2008, about 7,991 at the end of 2009 if held (ignoring the currency)."
    links: [damodaran_histret]
    checked: "2008: -36.55%, 2009: +25.94%, Damodaran table; 6,345 x 1.2594 = 7,991 (our calculation). Uses 2008, not 2020, so the card does not give away the outcome of the day-X task p4.m1 (March 2020)."

  - id: p4.c3
    title: "Write your rule before the storm"
    body: >-
      Decide now what you will do if your investments fall 20% or 30%: hold,
      rebalance, or, if your goal is near, move to safer assets on a schedule.
      A rule written in advance protects you from fear and from headlines. The
      hard task in this node lets you test your rule on past crashes.
    example: "My rule: if shares are more than 10 points away from 60%, rebalance once, at the end of the month."
    links: []
    checked: "App guidance, no external fact."

items:  # draft by Yurii (with Claude), 2026-11-20, based on the cards above
  - id: p4.e1
    kind: single
    q: "What does rebalancing a 60/40 portfolio mean?"
    options:
      - "Selling everything after a fall"
      - "Returning to the 60/40 target by selling some of what grew and buying what fell"
      - "Moving everything to what did best last year"
    answer: 1
    why: "Rebalancing returns the mix to its target from time to time, following a rule set in calm times."
    check: true
  - id: p4.e2
    kind: numeric
    q: "Your target is 60% shares. After a fall your portfolio is worth 8,000 PLN, with 4,000 PLN in shares. How much must move into shares to get back to 60%?"
    answer: 800
    unit: PLN
    tolerance: {kind: absolute, band: 50}
    input: {min: 0, max: 4000, step: 50}
    why: "60% of 8,000 is 4,800 PLN. Shares are at 4,000, so 800 PLN moves from bonds to shares."
    check: true
  - id: p4.e3
    kind: reflection
    q: "Your investments fell 25% in a month. What do you do?"
    options:
      - "Follow the rule I wrote down in advance"
      - "Sell everything before it falls further"
      - "Buy more of whatever fell most, without a plan"
    feedback:
      - "That is the point of a rule: it protects you from deciding in a panic."
      - "Selling after a fall locks in the loss. After 2008, those who sold at the bottom missed the rebound in 2009."
      - "Acting without a plan is the same problem in the other direction. A written rule is calmer."

medium:  # draft by Claude (AI), 2026-11-21. Day X: 31 March 2020 (named only in the reveal)
  - id: p4.m1
    variant: day_x
    content_version: 1
    author: "draft by Claude (AI), 2026-11-21"
    reviewer: null
    sources: [oecd_share_prices_pl]
    # Facts used on day X (all public by 31 Mar 2020; checked 2026-11-21, see MANUAL_RESEARCH.md):
    #   WHO called COVID-19 a pandemic on 11 Mar; Poland closed schools (12 Mar) and its borders (15 Mar);
    #   NBP board announced bond purchases on 16 Mar; the MPC cut the reference rate 1.50 -> 1.00% on
    #   17 Mar (effective 18 Mar); the "anti-crisis shield" law took effect on 1 Apr 2020.
    #   OECD index: Feb 2020 108.5, Mar 82.6 (-24%); a 60/40 mix from February is about 53/47 in March.
    #   Back above the February level by Dec 2020 (107.0) / Jan 2021 (111.6).
    # The chart is a monthly average price index (no dividends); March's average is known at the end of March.
    brief: >-
      Marek, 35, saves for his retirement, more than 20 years away. He had
      100,000 PLN invested: 60% in a broad Polish share fund and 40% in a bond
      fund. In calm times he decided that 60/40 is his target mix. Over the
      past few weeks share prices fell fast as a new virus spread and
      governments closed schools, shops and borders. The central bank cut
      its rate, and the government announced aid for firms and workers. His
      share fund is now well below 60% of his money. What should he do, and
      why?
    stimulus:
      - kind: chart
        type: line
        cutoff: 2020-03-31
        hide: [name, dates]
        series:
          - {series_id: oecd_share_prices_pl_m, from: 2018-01-01, to: 2021-12-01, transform: index100, label: "Polish share prices"}
    response:
      kind: choice
      options:
        - {id: sell, text: "Sell the share fund and keep the money in cash until things calm down"}
        - {id: hold, text: "Do nothing and keep the mix as it is now"}
        - {id: rebalance, text: "Rebalance: move money from the bond fund into shares, back to 60/40"}
        - {id: all_in, text: "Move everything into shares while they are cheap"}
    truth: none
    reasons:
      pick: {min: 2, max: 3}
      boxes:
        - {id: horizon, weight: 1.0, text: "He won't need this money for more than 20 years",
           explain: "A long horizon leaves time to recover from a fall. Money needed next year would be a different case."}
        - {id: rule, weight: 0.8, text: "He chose his 60/40 target in calm times for exactly this kind of moment",
           explain: "A rule made in advance protects him from deciding in fear, and it tells him to buy shares after a fall."}
        - {id: timing, weight: 0.6, text: "Nobody knows when the fall will stop, so selling means guessing when to buy back too",
           explain: "To gain from selling he would have to be right twice: when to get out and when to get back in."}
        - {id: lock_loss, weight: 0.4, text: "Selling now turns a fall on paper into a real loss",
           explain: "Partly right: the loss becomes final only if he stays out. The bigger problem is having to time the way back in."}
        - {id: support, weight: 0.2, text: "The central bank and the government are acting to support the economy",
           explain: "True on day X, but nobody could know how much it would help. It is no reason to change a long-term plan."}
        - {id: coupon, weight: 0.0, text: "His bond fund pays interest",
           explain: "True, but it doesn't help him decide what to do with the mix."}
        - {id: news_fear, weight: -0.5, text: "The news is frightening, so prices will keep falling",
           explain: "The bad news was already known and already in the prices. Fear is a feeling, not a forecast."}
        - {id: recovery, weight: -1.0, text: "Share prices will be back near their old level within a year",
           explain: "Nobody knew that on day X. Using it is hindsight."}
    reveal:
      text: >-
        Day X was the end of March 2020, the first weeks of the COVID-19
        pandemic. Polish share prices recovered over the following months.
        Selling at that point would have made the fall final; holding kept the
        plan; rebalancing bought shares after they had fallen. It could have
        gone the other way: in 2008 prices kept falling for months. A rule
        made in calm times works in both cases; a forecast made in fear does
        not. The chart is a price index without dividends.

hard:  # draft by Claude (AI), 2026-11-21. Engine: docs/hard_engine.md ("Next version": p4.h1 v2)
  - id: p4.h1
    level: hard
    content_version: 2
    author: "draft by Claude (AI), 2026-11-21"
    reviewer: "Mateusz, 2026-11-21 (situation, tests and lessons approved)"
    sources: [damodaran_histret, ecb_fsr_2022_corr, podatki_fund_units]
    brief: >-
      Marek, 35, has 100,000 PLN invested: 60% in a broad share fund and 40%
      in a bond fund. He adds 1,000 PLN every month. His goal, his daughter's
      studies, is 10 years away, so his target share of shares falls from 60%
      to 40% over those years. Every trade costs 0.29%, at least 5 PLN, and
      19% tax is due each year on the gains he realises by selling. Write his
      rule for the 10 years. Two tests must pass: in a long rally his shares
      stay within 10 points of the month's target, and in a crash, whenever it
      comes, they never fall more than 20 points below it, so no panic
      selling. Then we test your rule in other markets.
    assets: {shares: "the share fund", bonds: "the bond fund"}
    palette: [if, if_else, compare, and, or, not, math, number, set_var, change_var, my_var, invest_in, sell, rebalance]
    vars: [cash, invested, shares_weight, target_shares, drift, drawdown, months_since_rebalance, years_to_goal, tax_due_this_year]
    limits: {max_blocks: 30, max_depth: 5}
    starter_program:
      every_month: [{block: invest_in, amount: {block: var, name: cash}, asset: shares}]
    household:
      income: 7000
      costs: 6000
      buffer: 36000
      invested: {shares: 60000, bonds: 40000}
      target: {shares: 0.6, bonds: 0.4}
      glide: {asset: shares, from: 0.6, to: 0.4}
      broker_fee: {rate: 0.0029, min: 5}
      tax_on_gains: 0.19
      buffer_rate: 0.04
      card_rate: 0.20
    world:
      months: 120
      market:
        kind: fictional
        seed: 2026112103
        regimes:
          calm: {mean: 0.012, sd: 0.03}
          stress: {mean: -0.025, sd: 0.06}
          calm_to_stress: 0.06
          stress_to_calm: 0.3
        assets:
          shares: {label: "Share fund", beta: 1.0, noise: 0.01}
          bonds: {label: "Bond fund", alpha: 0.003, beta: 0.15, noise: 0.008}
    assumptions:
      - "Fund returns come from our fictional market: calm and stress periods, with bonds falling a little when shares fall hard. Not a forecast; real history replaces it once the data is loaded."
      - "Marek's target share of shares falls in a straight line from 60% in month 1 to 40% in month 120."
      - "Every buy or sell costs 0.29% of the money traded, at least 5 PLN. Rebalancing is one sale and one purchase."
      - "Tax: 19% of the year's net realised gains, paid every 12th month; losses are not carried into the next year. Gains are measured against the average price paid, a simplification of the real rules (which match a sale to the oldest purchase first). No IKE or IKZE."
      - "Marek has a 6-month buffer, so the tests are about his investments, not his budget."
      - "The market scenarios and their likelihoods are illustrative, chosen for teaching."
      - "After the tests, your rule also runs through 200 random 10-year futures: growth compared with the reference solution = 100."
    obligatory:
      - name: "A long rally: shares +1.5% a month for 10 years; stay within 10 points of the target"
        override: {trend: [{asset: shares, from: 1, to: 120, r: 0.015}, {asset: bonds, from: 1, to: 120, r: 0.002}]}
        check: {weight_near_target: {asset: shares, below: 0.10, above: 0.10}}
      - name: "A crash, whenever it comes: shares -15% two months in a row; never more than 20 points below the target"
        override: {}
        variants:
          - {returns: {shares: {6: -0.15, 7: -0.15}}}
          - {returns: {shares: {40: -0.15, 41: -0.15}}}
          - {returns: {shares: {100: -0.15, 101: -0.15}}}
        check: {weight_near_target: {asset: shares, below: 0.20, above: 1.0}}
    optional_metric: {near_target: {asset: shares, below: 0.10, above: 0.10}}
    optional:
      - {name: "Shares and bonds fall together for a year, as in 2022", probability: 0.20, override: {trend: [{asset: shares, from: 13, to: 24, r: -0.015}, {asset: bonds, from: 13, to: 24, r: -0.012}]}}
      - {name: "A crash in year 9, close to the goal: shares -30% in month 100", probability: 0.15, override: {returns: {shares: {100: -0.30}}}}
      - {name: "A fast rally: shares +3% a month for two years", probability: 0.15, override: {trend: [{asset: shares, from: 1, to: 24, r: 0.03}]}}
      - {name: "A 2008-style slide: shares -4% a month for a year", probability: 0.10, override: {trend: [{asset: shares, from: 30, to: 41, r: -0.04}]}}
      - {name: "A bond sell-off: bonds -2% a month for half a year", probability: 0.10, override: {trend: [{asset: bonds, from: 60, to: 65, r: -0.02}]}}
      - name: "A long sideways market: shares +5% and -5% in turn for two years"
        probability: 0.10
        override: {returns: {shares: {49: 0.05, 50: -0.05, 51: 0.05, 52: -0.05, 53: 0.05, 54: -0.05, 55: 0.05, 56: -0.05, 57: 0.05, 58: -0.05, 59: 0.05, 60: -0.05, 61: 0.05, 62: -0.05, 63: 0.05, 64: -0.05, 65: 0.05, 66: -0.05, 67: 0.05, 68: -0.05, 69: 0.05, 70: -0.05, 71: 0.05, 72: -0.05}}}
    futures: {n: 200, months: 120, seed: 13, job_loss_per_month: 0, job_loss_months: [1, 1], shock_per_month: 0, shock_amount: [0, 0]}
    reference_program:
      every_month:
        - block: if_else
          if: {block: compare, op: "<", left: {block: var, name: shares_weight}, right: {block: var, name: target_shares}}
          then: [{block: invest_in, amount: {block: var, name: cash}, asset: shares}]
          else: [{block: invest_in, amount: {block: var, name: cash}, asset: bonds}]
        - block: if
          if:
            block: and
            args:
              - {block: compare, op: ">", left: {block: var, name: drift}, right: {block: number, value: 0.05}}
              - block: compare
                op: ">"
                left: {block: math, op: "*", left: {block: var, name: drift}, right: {block: var, name: invested}}
                right: {block: number, value: 1000}
          then: [{block: rebalance}]
    known_bad_programs:
      - name: "Never rebalance, new money into shares"
        fails: "A long rally: shares +1.5% a month for 10 years; stay within 10 points of the target"
        program: {every_month: [{block: invest_in, amount: {block: var, name: cash}, asset: shares}]}
      - name: "Panic seller"
        fails: "A crash, whenever it comes: shares -15% two months in a row; never more than 20 points below the target"
        program:
          every_month:
            - block: if_else
              if: {block: compare, op: ">", left: {block: var, name: drawdown}, right: {block: number, value: 0.12}}
              then: [{block: sell, amount: {block: var, name: invested}, asset: shares}]
              else: [{block: invest_in, amount: {block: var, name: cash}, asset: bonds}]
    baseline_bots:
      - name: "Rebalances every month"
        program: {every_month: [{block: rebalance}, {block: invest_in, amount: {block: var, name: cash}, asset: shares}]}
      - name: "Rebalances once a year"
        program:
          every_month:
            - block: if
              if: {block: compare, op: ">", left: {block: var, name: months_since_rebalance}, right: {block: number, value: 11}}
              then: [{block: rebalance}]
            - {block: invest_in, amount: {block: var, name: cash}, asset: shares}
      - name: "New money always into shares, rebalance at 5 points"
        program:
          every_month:
            - block: if
              if: {block: compare, op: ">", left: {block: var, name: drift}, right: {block: number, value: 0.05}}
              then: [{block: rebalance}]
            - {block: invest_in, amount: {block: var, name: cash}, asset: shares}
      - name: "Never rebalances"
        program: {every_month: [{block: invest_in, amount: {block: var, name: cash}, asset: shares}]}
    editorial: >-
      The reference rule does two things. It puts each month's new money into
      whichever fund is below its target, which steers the mix back for the
      price of one small trade and without selling, so no tax. It rebalances
      only when the mix is more than 5 points off and the money to move is
      worth more than 1,000 PLN, so the minimum fee does not eat small trades.
      Because the target falls every month, a rule that keeps 60/40 drifts
      away from what Marek needs as his goal comes closer. Rebalancing every
      month keeps the mix tight but pays fees and tax again and again. In a
      crash, the rule buys shares when they are cheap, which is the opposite
      of panic selling.

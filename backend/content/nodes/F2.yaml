node: F2
panel: FOUNDATIONS
title: "Inflation and real value"
after: [F1]
author: "draft by Claude (AI), 2026-11-20"
reviewer: null
status: draft

cards:
  - id: f2.c1
    title: "Inflation: the same money buys less"
    body: >-
      Inflation is the rise in prices of what households buy. In Poland, the
      statistics office (GUS) measures it every month from a fixed basket of
      goods and services. When prices rise, each zloty buys a little less,
      even if the number on your account stays the same.
    example: "In December 2019, prices in Poland were 3.4% higher than a year earlier (GUS). 100 PLN then bought what about 96.70 PLN had bought a year before."
    links: [gus_cpi, ecb_what_is_inflation]
    checked: "GUS CPI, same month previous year = 100: Dec 2019 = 103.4 (series/data/gus_cpi_pl_m.csv). 100 / 1.034 = 96.71 (Claude, 2026-11-21)."

  - id: f2.c2
    title: "Real return: interest minus inflation"
    body: >-
      What matters is not how much your balance grows, but how much more it
      can buy. A quick rule: real return is about the interest rate minus
      inflation. If inflation is higher than the rate you earn, your savings
      lose buying power even while the balance grows.
    example: "An account pays 3% a year and prices rise 5%. 10,000 PLN becomes 10,300 PLN, but buys about 1.9% less than a year earlier."
    checked: "1.03 / 1.05 - 1 = -1.90% (Claude, 2026-11-21)."

  - id: f2.c3
    title: "Reading the inflation number"
    body: >-
      The headline inflation rate compares prices with the same month a year
      earlier. A rate of 3% means prices are 3% higher than twelve months
      ago, not that they rose 3% this month. When the rate falls, prices are
      still rising, only more slowly. Prices fall only when the rate is below
      zero.
    example: "Poland, 2020 (GUS): the rate fell from 4.6% in March to 2.4% in December, yet prices in December were still 2.4% higher than a year earlier."
    links: [gus_cpi, ecb_what_is_inflation]
    checked: "GUS CPI, same month previous year = 100: Mar 2020 = 104.6, Dec 2020 = 102.4 (series/data/gus_cpi_pl_m.csv). Uses 2019-2020 only, so it does not overlap the I2 Day-X chart window after its cutoff."

items:
  - id: f2.e1
    kind: numeric
    q: "Prices rise 10% in a year. A shopping basket cost 200 PLN. What does the same basket cost a year later?"
    answer: 220
    unit: PLN
    tolerance: {kind: absolute, band: 2}
    input: {min: 150, max: 300, step: 1}
    why: "200 x 1.10 = 220 PLN."
    check: true
  - id: f2.e2
    kind: single
    q: "A savings account pays 2% a year and prices rise 5%. After a year, what can your money buy?"
    options:
      - "More than today"
      - "Exactly the same as today"
      - "Less than today"
    answer: 2
    why: "Your balance grows 2%, but prices grow 5%, so the same money buys about 3% less."
    check: true
  - id: f2.e3
    kind: true_false
    q: "If the balance on your account grows, your buying power always grows too."
    answer: false
    why: "Not if prices rise faster than your balance. What counts is what the money buys."

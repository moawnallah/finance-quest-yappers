reference_program:
  every_month:
  - block: if_else
    if:
      block: compare
      op: '>'
      left:
        block: var
        name: drift
      right:
        block: number
        value: 0.05
    then:
    - block: rebalance
    else: []
  - block: invest
    amount:
      block: var
      name: cash
known_bad_programs:
- name: Never rebalance
  fails: 'A long rally: shares +2% a month for 36 months; keep shares between 50% and 70%'
  program:
    every_month:
    - block: invest
      amount:
        block: var
        name: cash
- name: Panic seller
  fails: 'A crash: shares -15% in months 3 and 4, then a recovery; never below 40% shares'
  program:
    every_month:
    - block: if_else
      if:
        block: compare
        op: '>'
        left:
          block: var
          name: drawdown
        right:
          block: number
          value: 0.15
      then:
      - block: sell_investments
        amount:
          block: var
          name: invested
      else:
      - block: invest
        amount:
          block: var
          name: cash
baseline_bots:
- name: Never rebalances
  program:
    every_month:
    - block: invest
      amount:
        block: var
        name: cash
- name: Rebalances every month
  program:
    every_month:
    - block: rebalance
    - block: invest
      amount:
        block: var
        name: cash
- name: Rebalances once a year
  program:
    every_month:
    - block: if_else
      if:
        block: compare
        op: '>'
        left:
          block: var
          name: months_since_rebalance
        right:
          block: number
          value: 11
      then:
      - block: rebalance
      else: []
    - block: invest
      amount:
        block: var
        name: cash
- name: Rebalances when 10 points off
  program:
    every_month:
    - block: if_else
      if:
        block: compare
        op: '>'
        left:
          block: var
          name: drift
        right:
          block: number
          value: 0.1
      then:
      - block: rebalance
      else: []
    - block: invest
      amount:
        block: var
        name: cash
editorial: The reference rule rebalances only when the mix is more than 5 points away from 60/40, and invests new money in
  the target mix. In a rally it sells some shares at high prices; in a crash it buys shares at low prices, which is the opposite
  of panic selling. Rebalancing every month keeps the mix tightest but pays the most fees. Waiting for 10 points lets the
  mix leave the 50-70% band before acting. A rule decided in calm times is what keeps you from selling at the bottom.

node: P4
id: p4.h1
level: hard
content_version: 1
author: draft by Claude (AI), 2026-11-21
reviewer: null
sources:
- damodaran_histret
- ecb_fsr_2022_corr
brief: 'Marek, 35, has 100,000 PLN invested: 60% in a broad share fund and 40% in a bond fund. He adds 1,000 PLN every month.
  Write his rule for the next 36 months. Two tests must pass: in a long rally his mix stays between 50% and 70% shares, and
  in a crash he never drops below 40% shares, so no panic selling. Rebalancing costs 0.1% of the money moved. Then we test
  your rule in other markets.'
palette:
- if_else
- compare
- and
- or
- not
- math
- number
- invest
- rebalance
- sell_investments
vars:
- cash
- shares_weight
- drift
- drawdown
- months_since_rebalance
- month
- invested
limits:
  max_blocks: 25
  max_depth: 4
starter_program:
  every_month:
  - block: invest
    amount:
      block: var
      name: cash
household:
  income: 7000
  costs: 6000
  buffer: 36000
  invested:
    shares: 60000
    bonds: 40000
  target:
    shares: 0.6
    bonds: 0.4
  trade_fee: 0.001
  buffer_rate: 0.04
  card_rate: 0.2
world:
  months: 36
  market:
    kind: synthetic
    seed: 2026112102
    assets:
      shares:
        mean: 0.006
        sd: 0.045
      bonds:
        mean: 0.003
        sd: 0.012
assumptions:
- Fund returns are synthetic (shares about 0.6% a month on average, bonds about 0.3%, with ups and downs). Not a forecast;
  real history replaces them once the data is loaded.
- New money is invested in the 60/40 target mix. Rebalancing moves money back to 60/40 and costs 0.1% of what is moved.
- Marek has a 6-month buffer, so the tests are about his investments, not his budget.
- The market scenarios and their likelihoods are illustrative, chosen for teaching.
- 'After the tests, your rule also runs through 200 random 10-year futures: growth compared with the reference solution =
  100.'
obligatory:
- name: 'A long rally: shares +2% a month for 36 months; keep shares between 50% and 70%'
  override:
    trend:
    - asset: shares
      from: 1
      to: 36
      r: 0.02
    - asset: bonds
      from: 1
      to: 36
      r: 0.002
  check:
    weight_between:
      asset: shares
      low: 0.5
      high: 0.7
- name: 'A crash: shares -15% in months 3 and 4, then a recovery; never below 40% shares'
  override:
    returns:
      shares:
        3: -0.15
        4: -0.15
    trend:
    - asset: shares
      from: 5
      to: 36
      r: 0.015
    - asset: bonds
      from: 1
      to: 36
      r: 0.002
  check:
    weight_at_least:
      asset: shares
      value: 0.4
optional_metric:
  band:
    asset: shares
    low: 0.5
    high: 0.7
optional:
